org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djdk.net.unixdomain.tmpdir=D:/tmp
android.useAndroidX=true
# No R8 shrinking in release builds. shared_preferences_android 2.5 calls
# its Kotlin code by name through JNI and ships no keep rules, so R8 removed
# SharedPreferencesApiRegistrar.getAll and v0.1.0 to v0.2.1 could not start.
# Without USB debugging, a build that never strips code by surprise is
# worth a few MB. Read by FlutterPluginUtils.shouldShrinkResources.
shrink=false
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
